<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>24點 全端會員對戰版</title>
    <style>
        body {
            font-family: "Microsoft JhengHei", Arial, sans-serif;
            background-color: #f4f7f6;
            color: #333;
            text-align: center;
            padding: 20px;
            margin: 0;
            user-select: none;
        }
        h1 { color: #2c3e50; margin-bottom: 10px; }
        
        /* 畫面區塊控制 */
        #auth-screen, #setup-screen, #game-screen, #end-screen { display: none; }
        
        /* 表單與面板基礎樣式 */
        .panel {
            background: #fff;
            max-width: 400px;
            margin: 40px auto;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }
        .setup-row { margin-bottom: 20px; text-align: left; }
        .setup-row label.title { font-weight: bold; display: block; margin-bottom: 8px; }
        .setup-row input[type="text"], .setup-row input[type="password"], .setup-row select { 
            width: 90%; padding: 10px; font-size: 16px; border-radius: 6px; border: 1px solid #ccc;
        }
        
        .mode-options { display: flex; gap: 20px; font-size: 18px; padding-bottom: 10px; border-bottom: 2px dashed #eee; margin-bottom: 15px;}
        .mode-options label { cursor: pointer; }

        /* 遊戲主畫面 */
        #header-info {
            display: flex;
            justify-content: space-between;
            max-width: 800px;
            margin: 0 auto 10px;
            font-size: 18px;
            font-weight: bold;
            background: #fff;
            padding: 10px 20px;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        .timer { color: #e74c3c; }
        
        #score-board {
            font-size: 24px;
            font-weight: bold;
            margin: 10px auto 20px;
            padding: 15px;
            background: #fff;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            display: inline-block;
            width: 80%;
            max-width: 600px;
        }
        .p1-score { color: #2980b9; }
        .p2-score { color: #8e44ad; }

        #buzzer-status {
            font-size: 22px;
            font-weight: bold;
            color: #d35400;
            margin: 10px 0;
            padding: 10px;
            border-radius: 8px;
            background-color: #fdebd0;
            transition: all 0.3s;
        }
        .buzzed-p1 { background-color: #d6eaf8 !important; color: #2980b9 !important; }
        .buzzed-p2 { background-color: #f4ecf8 !important; color: #8e44ad !important; }

        /* 工作區 */
        .workspace {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
            pointer-events: none;
            opacity: 0.5;
            transition: opacity 0.3s;
        }
        .workspace.active { pointer-events: auto; opacity: 1; }

        #cards-container, #operators-container {
            display: flex;
            justify-content: center;
            gap: 15px;
            min-height: 120px;
        }
        #operators-container { min-height: auto; margin-bottom: 10px; }

        .draggable-item {
            background: #fff;
            border: 2px solid #ccc;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 2px 2px 8px rgba(0,0,0,0.1);
            transition: transform 0.1s;
        }
        .draggable-item:hover { transform: scale(1.05); border-color: #3498db; }
        .draggable-item:active { transform: scale(0.95); }

        .card { width: 80px; height: 120px; font-size: 28px; flex-direction: column; }
        .operator { width: 50px; height: 50px; font-size: 24px; border-radius: 50%; color: #34495e; }
        
        .red { color: #e74c3c; }
        .black { color: #2c3e50; }

        #equation-zone {
            width: 80%; max-width: 600px; min-height: 80px; background: #fff;
            border: 3px dashed #bdc3c7; border-radius: 12px; margin: 20px auto;
            display: flex; align-items: center; justify-content: center; flex-wrap: wrap; gap: 10px; padding: 15px;
            font-size: 32px; font-family: monospace;
        }
        #equation-zone.dragover { background-color: #ecf0f1; border-color: #3498db; }
        
        .eq-item {
            background: #ecf0f1; padding: 5px 15px; border-radius: 8px;
            cursor: pointer; box-shadow: 1px 1px 3px rgba(0,0,0,0.2); font-weight: bold;
        }
        .eq-item:hover { background: #e74c3c; color: white; }

        .controls { margin: 20px 0; display: flex; justify-content: center; gap: 15px; }
        button {
            padding: 12px 25px; font-size: 18px; font-weight: bold; cursor: pointer;
            border: none; border-radius: 8px; background-color: #27ae60; color: white; transition: background 0.3s;
        }
        button:hover { background-color: #2ecc71; }
        .btn-home { background-color: #7f8c8d; }
        .btn-home:hover { background-color: #95a5a6; }
        .btn-history { background-color: #2980b9; margin-top: 10px; width: 100%;}
        .btn-history:hover { background-color: #3498db; }

        #msg-box { font-size: 18px; font-weight: bold; min-height: 25px; margin: 10px; }
        .success { color: #27ae60; }
        .error { color: #e74c3c; }

        /* 歷史紀錄彈出面板 */
        #history-modal {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.5); justify-content: center; align-items: center; z-index: 100;
        }
        .modal-content {
            background: white; padding: 25px; border-radius: 12px; width: 80%; max-width: 500px;
            max-height: 70vh; overflow-y: auto; text-align: left;
        }
        .history-item { border-bottom: 1px solid #eee; padding: 10px 0; font-size: 15px; }
    </style>
</head>
<body>

    <div id="auth-screen" class="panel" style="display: block;">
        <h2>🔐 24點 會員登入</h2>
        <div id="auth-msg" class="error" style="margin-bottom: 10px;"></div>
        <div class="setup-row">
            <label class="title">用戶帳號：</label>
            <input type="text" id="auth-username" placeholder="請輸入帳號">
        </div>
        <div class="setup-row">
            <label class="title">用戶密碼：</label>
            <input type="password" id="auth-password" placeholder="請輸入密碼">
        </div>
        <div style="display: flex; gap: 15px; justify-content: center;">
            <button onclick="handleAuth('login')">立即登入</button>
            <button onclick="handleAuth('register')" style="background-color: #e67e22;">註冊帳號</button>
        </div>
    </div>

    <div id="setup-screen" class="panel">
        <h2>🃏 24點 遊戲大廳</h2>
        <p style="text-align: right; color: #7f8c8d; font-weight: bold;">歡迎，<span id="user-display" style="color: #27ae60;"></span>！</p>
        
        <div class="setup-row">
            <label class="title">選擇遊玩模式：</label>
            <div class="mode-options">
                <label><input type="radio" name="playMode" value="single" checked onchange="togglePlayMode()"> 🧘 單人獨享</label>
                <label><input type="radio" name="playMode" value="battle" onchange="togglePlayMode()"> ⚔️ 雙人對戰</label>
            </div>
        </div>

        <div class="setup-row">
            <label class="title">選擇比賽依據：</label>
            <div class="mode-options">
                <label><input type="radio" name="gameMode" value="rounds" checked onchange="toggleGameMode()"> 指定題數</label>
                <label><input type="radio" name="gameMode" value="time" onchange="toggleGameMode()"> 指定時間</label>
            </div>
        </div>

        <div class="setup-row" id="row-rounds">
            <label class="title">總題數：</label>
            <select id="sel-rounds">
                <option value="5">5 題</option>
                <option value="10">10 題</option>
                <option value="20">20 題</option>
            </select>
        </div>

        <div class="setup-row" id="row-time" style="display: none;">
            <label class="title">遊戲時間：</label>
            <select id="sel-time">
                <option value="60">1 分鐘</option>
                <option value="180">3 分鐘</option>
                <option value="300">5 分鐘</option>
            </select>
        </div>

        <button onclick="initGame()" style="width: 100%;">開始遊戲</button>
        <button onclick="fetchPersonalHistory()" class="btn-history">📜 查看歷史出題紀錄</button>
    </div>

    <div id="game-screen">
        <div id="header-info">
            <span class="timer" id="time-display-container">⏳ 時間: <span id="time-display">無限制</span></span>
            <span id="mode-display-container">📝 題數: <span id="round-display">1</span> / <span id="total-round-display">10</span></span>
        </div>

        <div id="score-board">
            <span class="p1-score" id="p1-title">玩家一: <span id="score1">0</span></span>
            <span id="p2-score-divider"> &nbsp; | &nbsp; </span>
            <span class="p2-score" id="p2-title">玩家二 (M鍵): <span id="score2">0</span></span>
        </div>

        <div id="buzzer-status">發牌中...</div>
        <div id="msg-box"></div>

        <div class="workspace" id="workspace">
            <div id="cards-container"></div>
            <div id="operators-container">
                <div class="draggable-item operator" draggable="true" data-type="op" data-val="+">+</div>
                <div class="draggable-item operator" draggable="true" data-type="op" data-val="-">-</div>
                <div class="draggable-item operator" draggable="true" data-type="op" data-val="*">×</div>
                <div class="draggable-item operator" draggable="true" data-type="op" data-val="/">÷</div>
                <div class="draggable-item operator" draggable="true" data-type="op" data-val="(">(</div>
                <div class="draggable-item operator" draggable="true" data-type="op" data-val=")">)</div>
            </div>
            <p style="margin-bottom: 5px; color: #7f8c8d;">▼ 將卡片與符號拖曳至此 (或直接點擊) / 點擊下方區塊可退回 ▼</p>
            <div id="equation-zone"></div>
        </div>

        <div class="controls">
            <button id="skip-btn" onclick="skipRound()">⏭️ 放棄跳過</button>
            <button class="btn-home" onclick="returnToLobby()">🏠 返回主選單</button>
        </div>
    </div>

    <div id="end-screen" class="panel">
        <h1>🏆 遊戲結束</h1>
        <h2 id="final-result"></h2>
        <br>
        <button class="btn-home" onclick="returnToLobby()">🏠 返回主選單</button>
    </div>

    <div id="history-modal">
        <div class="modal-content">
            <h2 style="margin-top:0;">📜 我的算題歷史明細</h2>
            <div id="history-list">讀取中...</div>
            <br>
            <button onclick="document.getElementById('history-modal').style.display='none'" style="background-color:#7f8c8d; width:100%;">關閉視窗</button>
        </div>
    </div>

    <script>
        const BACKEND_URL = 'https://two4point-lc7l.onrender.com';

        const suits = ['♠', '♥', '♦', '♣'];
        let deck = [];
        let scores = { 1: 0, 2: 0 };
        
        let currentUser = '';
        let playMode = 'single'; 
        let gameMode = 'rounds'; 
        let totalRounds = 10;
        let currentRound = 1;
        let timeRemaining = 300;
        let timerInterval;
        
        let activePlayer = null; 
        let cardsUsedCount = 0;

        async function handleAuth(type) {
            const userInp = document.getElementById('auth-username').value.trim();
            const passInp = document.getElementById('auth-password').value.trim();
            const msgBox = document.getElementById('auth-msg');

            if(!userInp || !passInp) {
                msgBox.innerText = '⚠️ 請完整填寫帳號與密碼！';
                return;
            }

            try {
                const res = await fetch(`${BACKEND_URL}/api/${type}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username: userInp, password: passInp })
                });
                const data = await res.json();

                if(!res.ok) {
                    msgBox.innerText = data.message;
                } else {
                    alert(data.message);
                    if(type === 'login') {
                        currentUser = data.username;
                        document.getElementById('user-display').innerText = currentUser;
                        document.getElementById('auth-screen').style.display = 'none';
                        document.getElementById('setup-screen').style.display = 'block';
                    }
                }
            } catch (e) {
                msgBox.innerText = '🔴 無法連線至雲端後台伺服器！';
            }
        }

        async function fetchPersonalHistory() {
            const modal = document.getElementById('history-modal');
            const listContainer = document.getElementById('history-list');
            modal.style.display = 'flex';
            listContainer.innerHTML = '正在從雲端同步明細...';

            try {
                const res = await fetch(`${BACKEND_URL}/api/history?username=${currentUser}`);
                const data = await res.json();

                if(!data || data.length === 0) {
                    listContainer.innerHTML = '🫙 目前尚無任何算題紀錄。快去玩一局吧！';
                    return;
                }

                listContainer.innerHTML = data.map((item, idx) => `
                    <div class="history-item">
                        <strong>第 ${data.length - idx} 筆紀錄</strong> (${new Date(item.playedAt).toLocaleString()})<br>
                        🎴 出題數字: [ ${item.cards.join(', ')} ]<br>
                        🎮 模式: ${item.gameMode === 'single' ? '單人獨享' : '雙人對戰'}<br>
                        🏁 結果狀態: <span style="color:${item.winner.includes('失敗') || item.winner.includes('放棄') ? '#e74c3c':'#27ae60'}">${item.winner}</span>
                    </div>
                `).join('');
            } catch (e) {
                listContainer.innerHTML = '❌ 歷史紀錄讀取失敗，請確認後端是否正在運作。';
            }
        }

        function togglePlayMode() {
            playMode = document.querySelector('input[name="playMode"]:checked').value;
        }

        function toggleGameMode() {
            gameMode = document.querySelector('input[name="gameMode"]:checked').value;
            document.getElementById('row-rounds').style.display = (gameMode === 'rounds') ? 'block' : 'none';
            document.getElementById('row-time').style.display = (gameMode === 'time') ? 'block' : 'none';
        }

        function hasSolution(nums) {
            if (nums.length === 1) return nums[0] === 24;
            for (let i = 0; i < nums.length; i++) {
                for (let j = 0; j < nums.length; j++) {
                    if (i !== j) {
                        let nextNums = [];
                        for (let k = 0; k < nums.length; k++) if (k !== i && k !== j) nextNums.push(nums[k]);
                        let a = nums[i], b = nums[j];
                        let possibleValues = [a + b, a - b, a * b];
                        if (b !== 0 && a % b === 0) possibleValues.push(a / b);
                        for (let val of possibleValues) {
                            nextNums.push(val);
                            if (hasSolution(nextNums)) return true;
                            nextNums.pop();
                        }
                    }
                }
            }
            return false;
        }

        function initGame() {
            scores = { 1: 0, 2: 0 };
            currentRound = 1;
            document.getElementById('score1').innerText = '0';
            document.getElementById('score2').innerText = '0';

            if (playMode === 'single') {
                document.getElementById('p1-title').innerHTML = `玩家挑戰分數: <span id="score1">0</span>`;
                document.getElementById('p2-score-divider').style.display = 'none';
                document.getElementById('p2-title').style.display = 'none';
                document.getElementById('skip-btn').innerText = '⏭️ 放棄本題 (扣分並跳過)';
            } else {
                document.getElementById('p1-title').innerHTML = `玩家一 (Z鍵): <span id="score1">0</span>`;
                document.getElementById('p2-score-divider').style.display = 'inline';
                document.getElementById('p2-title').style.display = 'inline';
                document.getElementById('skip-btn').innerText = '⏭️ 雙方放棄跳過 (平手)';
            }
            
            if (gameMode === 'rounds') {
                totalRounds = parseInt(document.getElementById('sel-rounds').value);
                document.getElementById('mode-display-container').innerHTML = `📝 題數: <span id="round-display">1</span> / ${totalRounds}`;
                document.getElementById('time-display-container').innerHTML = `⏳ 時間: 無限制`;
            } else {
                timeRemaining = parseInt(document.getElementById('sel-time').value);
                document.getElementById('mode-display-container').innerHTML = `📝 已答題數: <span id="round-display">1</span>`;
                document.getElementById('time-display-container').innerHTML = `⏳ 剩餘時間: <span id="time-display">00:00</span>`;
                
                updateTimerDisplay();
                timerInterval = setInterval(() => {
                    timeRemaining--;
                    updateTimerDisplay();
                    if (timeRemaining <= 0) endGame("⏰ 時間到！");
                }, 1000);
            }

            document.getElementById('setup-screen').style.display = 'none';
            document.getElementById('game-screen').style.display = 'block';

            drawCards();
            setupDragAndDrop();
        }

        function updateTimerDisplay() {
            if (gameMode === 'time') {
                let m = Math.floor(timeRemaining / 60).toString().padStart(2, '0');
                let s = (timeRemaining % 60).toString().padStart(2, '0');
                document.getElementById('time-display').innerText = `${m}:${s}`;
            }
        }

        function drawCards() {
            document.getElementById('round-display').innerText = currentRound;
            document.getElementById('equation-zone').innerHTML = '';
            cardsUsedCount = 0;
            
            let isValid = false;
            let tempCards = [];
            let drawnObjects = [];

            while (!isValid) {
                deck = [];
                for (let i = 1; i <= 13; i++) for (let suit of suits) deck.push({ value: i, suit: suit });
                tempCards = [];
                drawnObjects = [];
                for (let i = 0; i < 4; i++) {
                    let card = deck.splice(Math.floor(Math.random() * deck.length), 1)[0];
                    tempCards.push(card.value);
                    drawnObjects.push(card);
                }
                if (hasSolution(tempCards)) isValid = true;
            }

            renderCards(drawnObjects);
            
            if(playMode === 'single') {
                activePlayer = 1; 
                document.getElementById('workspace').classList.add('active');
                let status = document.getElementById('buzzer-status');
                status.innerText = "🧩 單人挑戰中：請排出能組成 24 的算式後，按【空白鍵】送出驗證！";
                status.className = '';
                document.getElementById('msg-box').innerText = '';
            } else {
                resetBuzzer();
            }
        }

        function renderCards(cards) {
            let container = document.getElementById('cards-container');
            container.innerHTML = '';
            cards.forEach((card, index) => {
                let displayValue = card.value;
                if (displayValue === 1) displayValue = 'A';
                else if (displayValue === 11) displayValue = 'J';
                else if (displayValue === 12) displayValue = 'Q';
                else if (displayValue === 13) displayValue = 'K';

                let cardDiv = document.createElement('div');
                cardDiv.className = `draggable-item card ${(card.suit === '♥' || card.suit === '♦') ? 'red' : 'black'}`;
                cardDiv.draggable = true;
                cardDiv.dataset.type = 'card';
                cardDiv.dataset.val = card.value; 
                cardDiv.dataset.display = `${card.suit}${displayValue}`;
                cardDiv.id = `card-${index}`;
                cardDiv.innerHTML = `<span>${card.suit}</span><span>${displayValue}</span>`;
                
                cardDiv.onclick = () => { if(activePlayer !== null) addToEquation(cardDiv); };
                container.appendChild(cardDiv);
            });
        }

        function resetBuzzer() {
            activePlayer = null;
            document.getElementById('workspace').classList.remove('active');
            let status = document.getElementById('buzzer-status');
            status.innerText = "⚡ 雙人對戰：請準備搶答！ (玩家一按 Z，玩家二按 M)";
            status.className = '';
            document.getElementById('msg-box').innerText = '';
        }

        document.addEventListener('keydown', (e) => {
            if (document.getElementById('game-screen').style.display !== 'block') return;

            if (playMode === 'battle' && activePlayer === null) {
                if (e.key.toLowerCase() === 'z') {
                    activePlayer = 1;
                    lockBuzzer(1, "🔵 玩家一 (藍方) 搶到了！請排列算式並按【空白鍵】送出");
                } else if (e.key.toLowerCase() === 'm') {
                    activePlayer = 2;
                    lockBuzzer(2, "🟣 玩家二 (紫方) 搶到了！請排列算式並按【空白鍵】送出");
                }
            } 
            else if (e.code === 'Space') {
                e.preventDefault(); 
                evaluateAnswer();
            }
        });

        function lockBuzzer(player, msg) {
            document.getElementById('workspace').classList.add('active');
            let status = document.getElementById('buzzer-status');
            status.innerText = msg;
            status.className = player === 1 ? 'buzzed-p1' : 'buzzed-p2';
        }

        function setupDragAndDrop() {
            let eqZone = document.getElementById('equation-zone');
            
            document.querySelectorAll('.operator').forEach(op => {
                op.onclick = () => { if(activePlayer !== null) addToEquation(op); };
                op.ondragstart = (e) => dragStart(e, op);
            });

            document.addEventListener('dragstart', (e) => {
                if (e.target.classList.contains('card')) dragStart(e, e.target);
            });

            eqZone.ondragover = (e) => { e.preventDefault(); eqZone.classList.add('dragover'); };
            eqZone.ondragleave = () => eqZone.classList.remove('dragover');
            eqZone.ondrop = (e) => {
                e.preventDefault();
                eqZone.classList.remove('dragover');
                if (activePlayer === null) return;
                
                let sourceId = e.dataTransfer.getData("id");
                let isOp = e.dataTransfer.getData("isOp") === "true";
                let el = isOp ? document.querySelector(`.operator[data-val="${sourceId}"]`) : document.getElementById(sourceId);
                if(el) addToEquation(el);
            };
        }

        function dragStart(e, el) {
            if (activePlayer === null) { e.preventDefault(); return; }
            let isOp = el.dataset.type === 'op';
            e.dataTransfer.setData("id", isOp ? el.dataset.val : el.id);
            e.dataTransfer.setData("isOp", isOp);
        }

        function addToEquation(el) {
            let isCard = el.dataset.type === 'card';
            let val = el.dataset.val;
            let display = isCard ? el.dataset.display : el.innerText;

            if (isCard) {
                el.style.display = 'none';
                cardsUsedCount++;
            }

            let newEqItem = document.createElement('span');
            newEqItem.className = 'eq-item';
            newEqItem.innerText = display;
            newEqItem.dataset.val = val; 
            if (isCard) newEqItem.dataset.sourceId = el.id;

            newEqItem.onclick = function() {
                if (this.dataset.sourceId) {
                    document.getElementById(this.dataset.sourceId).style.display = 'flex';
                    cardsUsedCount--;
                }
                this.remove();
            };

            document.getElementById('equation-zone').appendChild(newEqItem);
        }

        function clearEquationZone() {
            document.getElementById('equation-zone').innerHTML = '';
            document.querySelectorAll('.card').forEach(c => c.style.display = 'flex');
            cardsUsedCount = 0;
        }

        function processNextRound() {
            currentRound++;
            if (gameMode === 'rounds' && currentRound > totalRounds) {
                endGame("🏆 指定題數已全部挑戰完畢！");
            } else {
                drawCards();
            }
        }

        function evaluateAnswer() {
            let msgBox = document.getElementById('msg-box');
            
            if (cardsUsedCount !== 4) {
                msgBox.innerHTML = "<span class='error'>❌ 必須使用全部 4 張牌！請繼續排列。</span>";
                return;
            }

            let eqItems = Array.from(document.getElementById('equation-zone').children);
            let mathStr = eqItems.map(item => {
                let v = item.dataset.val;
                if(v === '×') return '*';
                if(v === '÷') return '/';
                return v;
            }).join('');

            try {
                let result = eval(mathStr);
                if (result === 24) {
                    msgBox.innerHTML = "<span class='success'>🎉 恭喜答對！成功組成 24 點！</span>";
                    scores[activePlayer]++;
                    document.getElementById(`score${activePlayer}`).innerText = scores[activePlayer];
                    
                    let currentCards = Array.from(document.querySelectorAll('.card')).map(c => parseInt(c.dataset.val));
                    let p1RoundWin = (activePlayer === 1) ? 1 : 0;
                    let p2RoundWin = (activePlayer === 2) ? 1 : 0;
                    
                    saveGameStatsToServer(p1RoundWin, p2RoundWin, currentCards);

                    setTimeout(() => {
                        processNextRound(); 
                    }, 1500);

                } else {
                    msgBox.innerHTML = `<span class='error'>❌ 算出來是 ${result} 答錯了！${playMode === 'single' ? '請重新修正算式！':'重置並重新開放搶答。'}</span>`;
                    if (playMode === 'battle') {
                        setTimeout(() => {
                            clearEquationZone();
                            resetBuzzer();
                        }, 2000);
                    }
                }
            } catch (e) {
                msgBox.innerHTML = "<span class='error'>❌ 算式結構錯誤 (例如括號不完整)，請檢查！</span>";
                if (playMode === 'battle') {
                    setTimeout(() => {
                        clearEquationZone();
                        resetBuzzer();
                    }, 2000);
                }
            }
        }

        function skipRound() {
            let msgBox = document.getElementById('msg-box');
            msgBox.innerHTML = "<span class='error'>⏭️ 放棄本題，準備發放下一題牌組...</span>";
            
            let currentCards = Array.from(document.querySelectorAll('.card')).map(c => parseInt(c.dataset.val));
            saveGameStatsToServer(0, 0, currentCards);

            setTimeout(() => {
                processNextRound(); 
            }, 1500);
        }

        async function saveGameStatsToServer(p1, p2, cards) {
            try {
                await fetch(`${BACKEND_URL}/api/stats`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ 
                        username: currentUser, 
                        gameMode: playMode, 
                        p1: p1, 
                        p2: p2, 
                        cards: cards 
                    }) 
                });
            } catch (error) {
                console.error("資料傳輸錯誤，未與雲端同步:", error);
            }
        }

        function endGame(reason) {
            clearInterval(timerInterval); 
            document.getElementById('game-screen').style.display = 'none';
            document.getElementById('end-screen').style.display = 'block';

            let resText = `${reason}<br><br>`;
            if (playMode === 'single') {
                resText += `👤 本局你一共成功解出：${scores[1]} 題！`;
            } else {
                resText += `玩家一得分: ${scores[1]}<br>玩家二得分: ${scores[2]}<br><br>`;
                if (scores[1] > scores[2]) resText += "🏆 玩家一 獲勝！";
                else if (scores[2] > scores[1]) resText += "🏆 玩家二 獲勝！";
                else resText += "🤝 雙方旗鼓相當，平手！";
            }

            document.getElementById('final-result').innerHTML = resText;
        }

        // 🌟 新增功能：安全返回大廳面板（不刷新網頁，保留登入帳號）
        function returnToLobby() {
            clearInterval(timerInterval); // 安全清除可能殘留的計時器
            document.getElementById('game-screen').style.display = 'none';
            document.getElementById('end-screen').style.display = 'none';
            document.getElementById('setup-screen').style.display = 'block';
        }
    </script>
</body>
</html>
