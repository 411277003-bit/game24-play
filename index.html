<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>24點 現代明亮撲克版</title>
    <style>
        body {
            font-family: "Microsoft JhengHei", Arial, sans-serif;
            background-color: #f1f5f9; 
            background-image: radial-gradient(#ffffff 40%, #e2e8f0 90%); 
            color: #334155; 
            text-align: center;
            padding: 10px;
            margin: 0;
            user-select: none;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow: hidden; 
        }
        h2 { color: #1e293b; margin: 0 0 5px 0; font-weight: bold; font-size: 24px; }
        
        #auth-screen, #setup-screen, #game-screen, #end-screen { display: none; }
        
        /* 統一黃金寬度，達成絕對中軸垂直對齊 */
        .panel, #header-info, #score-board, #buzzer-status, .workspace, #equation-zone {
            width: 100% !important;
            max-width: 400px !important; 
            margin-left: auto !important;
            margin-right: auto !important;
            box-sizing: border-box !important;
        }

        .panel {
            background: transparent; 
            padding: 10px;
            border: none; 
            position: relative;
        }
        
        .setup-row { margin-bottom: 10px; text-align: left; width: 100%; }
        .setup-row label.title { font-weight: bold; display: block; margin-bottom: 4px; color: #475569; font-size: 13px; }
        
        .setup-row input[type="text"], .setup-row input[type="password"], .setup-row input[type="number"] { 
            width: 100%; padding: 10px; font-size: 14px; border-radius: 8px; border: 2px solid #cbd5e1; 
            box-sizing: border-box; background-color: #ffffff; color: #1e293b; font-weight: bold; transition: all 0.2s;
        }
        .setup-row input:focus { border-color: #dc3545; outline: none; }

        /* 大廳撲克牌按鈕 */
        .game-card-container { display: flex; gap: 12px; width: 100%; }
        .game-card {
            flex: 1; background: #ffffff; border: 2px solid #cbd5e1; border-radius: 10px;
            padding: 10px 5px; text-align: center; cursor: pointer; position: relative;
            display: flex; flex-direction: column; align-items: center; gap: 4px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            transition: transform 0.2s, box-shadow 0.2s, border-color 0.2s;
        }
        .game-card:hover { 
            transform: translateY(-5px); 
            border-color: #94a3b8;
            box-shadow: 0 8px 15px rgba(0,0,0,0.1);
        }
        .game-card.active { 
            border-color: #d4af37; 
            background-color: #fffdf5;
            transform: translateY(-4px);
            box-shadow: 0 6px 12px rgba(214,175,55,0.2);
        }
        .game-card .icon { font-size: 20px; }
        .game-card .text { font-size: 13px; font-weight: bold; color: #334155; }

        #menu-toggle-btn {
            position: absolute; top: -5px; right: 5px; font-size: 16px; cursor: pointer;
            background: #ffffff; border: 2px solid #cbd5e1; border-radius: 50%; width: 34px; height: 34px;
            display: flex; align-items: center; justify-content: center; color: #475569;
            box-shadow: 0 2px 5px rgba(0,0,0,0.08); transition: all 0.2s;
        }
        
        #sidebar-drawer {
            position: fixed; top: 0; right: -280px; width: 260px; height: 100%;
            background: #ffffff; box-shadow: -10px 0 30px rgba(0,0,0,0.08);
            transition: right 0.25s ease-out; padding: 25px 20px;
            box-sizing: border-box; z-index: 90; text-align: left; border-left: 4px solid #d4af37;
        }
        #sidebar-drawer.open { right: 0; }
        .sidebar-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px; border-bottom: 2px solid #f1f5f9; padding-bottom: 10px; }
        .sidebar-header h3 { margin: 0; color: #1e293b; font-weight: bold; font-size: 18px; }
        .sidebar-close { font-size: 26px; cursor: pointer; color: #94a3b8; font-weight: bold; }
        
        .sidebar-btn {
            width: 100%; padding: 12px 15px; background: #ffffff; border: 2px solid #e2e8f0;
            color: #334155; border-radius: 10px; font-size: 14px; font-weight: bold; cursor: pointer;
            margin-bottom: 12px; text-align: left; display: flex; align-items: center; gap: 10px; transition: all 0.2s;
        }
        .sidebar-btn:hover { background: #f8fafc; border-color: #94a3b8; transform: translateX(-2px); }
        .sidebar-btn.logout { background: #fef2f2; border-color: #fee2e2; color: #ef4444; }

        .history-tabs { display: flex; gap: 10px; margin-bottom: 15px; border-bottom: 2px solid #e2e8f0; padding-bottom: 10px; }
        .tab-btn {
            flex: 1; padding: 10px 5px; font-size: 13px; font-weight: bold; cursor: pointer; border: 2px solid #cbd5e1;
            border-radius: 8px; background: #ffffff; color: #475569; transition: all 0.15s; text-align: center;
        }
        .tab-btn.active { background: #1e293b; color: white; border-color: #1e293b; }

        /* 資訊提示區：內容靠左對齊，面框寬度中軸對齊 */
        #header-info, #score-board, #buzzer-status {
            display: flex; 
            justify-content: flex-start; 
            align-items: center;
            text-align: left;
            margin: 0 auto 8px !important; 
            padding: 12px 16px !important;
            background: #ffffff;
            border-radius: 10px; 
            border: 2px solid #cbd5e1; 
            box-shadow: 0 2px 5px rgba(0,0,0,0.02);
            color: #1e293b;
        }

        #header-info { gap: 15px; font-size: 14px; font-weight: bold; }
        .timer { color: #dc3545; background: #fef2f2; padding: 2px 8px; border-radius: 20px; } 

        #score-board { font-size: 18px; font-weight: bold; color: #334155; }
        .p1-score { color: #2563eb; } 
        .p2-score { color: #7c3aed; }

        #buzzer-status { font-size: 14px; font-weight: bold; background-color: #f8fafc; }
        .buzzed-p1 { background-color: #eff6ff !important; color: #2563eb !important; border-color: #bfdbfe !important; }
        .buzzed-p2 { background-color: #f5f3ff !important; color: #7c3aed !important; border-color: #e9d5ff !important; }

        .workspace { display: flex; flex-direction: column; align-items: center; gap: 10px; pointer-events: none; opacity: 0.3; transition: opacity 0.3s; margin: 0 auto !important;}
        .workspace.active { pointer-events: auto; opacity: 1; }
        #cards-container, #operators-container { display: flex; justify-content: center; gap: 10px; min-height: 110px; width: 100%; }
        #operators-container { min-height: auto; margin-bottom: 2px; gap: 8px; }

        .draggable-item {
            background: #ffffff; border: 2px solid #cbd5e1; border-radius: 10px; display: flex; align-items: center; justify-content: center;
            font-weight: bold; cursor: pointer; box-shadow: 0 4px 6px rgba(0,0,0,0.05); transition: transform 0.1s, border-color 0.15s; color: #1e293b;
            overflow: hidden;
        }
        .draggable-item:hover { transform: translateY(-3px); border-color: #dc3545; }
        
        /* 撲克牌形狀：原汁原味純正直立經典款 */
        .card { 
            width: 78px; height: 112px; flex-direction: column; justify-content: space-between; padding: 5px 0; background: #ffffff; 
            animation: dealCard 0.35s cubic-bezier(0.175, 0.885, 0.32, 1.15) backwards;
        }
        @keyframes dealCard {
            from { transform: translateY(40px) rotate(10deg); opacity: 0; }
            to { transform: translateY(0) rotate(0deg); opacity: 1; }
        }

        .operator { width: 44px; height: 44px; font-size: 20px; border-radius: 50%; color: #475569; background: #f1f5f9; border-color: #cbd5e1; }
        
        .red { color: #dc3545; } 
        .black { color: #1e293b; } 

        #equation-zone {
            background: #f8fafc; border: 2px dashed #cbd5e1; border-radius: 12px; min-height: 60px;
            margin: 0 auto 10px !important; display: flex; align-items: center; justify-content: center; flex-wrap: wrap; gap: 6px; padding: 10px;
        }
        .eq-item { background: #ffffff; padding: 5px 12px; border-radius: 8px; cursor: pointer; font-weight: bold; color: #1e293b; border: 2px solid #e2e8f0; }
        .eq-item:hover { background: #dc3545; color: #fff; border-color: #dc3545; }

        .controls { margin: 8px 0; display: flex; justify-content: center; gap: 10px; width: 100%; }
        
        button { 
            padding: 10px 26px; font-size: 15px; font-weight: bold; cursor: pointer; border: none; border-radius: 10px; 
            background-color: #dc3545; color: white; transition: all 0.15s; box-shadow: 0 4px 6px rgba(220,53,69,0.15);
        }
        button:hover { background-color: #bd2130; transform: translateY(-1px); }
        button:active { transform: translateY(1px); } 
        
        .btn-home { background-color: #64748b; box-shadow: 0 4px 6px rgba(100,116,139,0.15); }
        .btn-home:hover { background-color: #475569; }

        #msg-box { font-size: 15px; font-weight: bold; min-height: 22px; margin: 4px; }
        .success { color: #15803d; }
        .error { color: #b91c1c; }

        #history-modal, #password-modal {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(15,23,42,0.4); justify-content: center; align-items: center; z-index: 100; backdrop-filter: blur(4px);
        }
        .modal-content {
            background: #ffffff; padding: 25px; border-radius: 20px; width: 85%; max-width: 420px;
            max-height: 70vh; overflow-y: auto; text-align: left; border: 1px solid #e2e8f0; color: #1e293b;
        }
        .history-item { border-bottom: 2px solid #f1f5f9; padding: 12px 0; font-size: 14px; color: #475569; line-height: 1.6; }
    </style>
</head>
<body>

    <div id="auth-screen" class="panel" style="display: block;">
        <h2>🔐 24點 會員登入</h2>
        <div id="auth-msg" class="error" style="margin-bottom: 10px;"></div>
        <div class="setup-row">
            <label class="title">用戶帳號：</label>
            <input type="text" id="auth-username" placeholder="請輸入帳號">
        </div>
        <div class="setup-row">
            <label class="title">用戶密碼：</label>
            <input type="password" id="auth-password" placeholder="請輸入密碼">
        </div>
        <div style="margin-top: 15px;">
            <button id="auth-submit-btn" onclick="submitAuth()" style="width: 100%; padding: 12px;">立即登入</button>
        </div>
        <p id="auth-toggle-text" style="margin-top: 15px; font-size: 14px; color: #64748b; font-weight: bold;">
            還沒有帳號嗎？ <span onclick="switchAuthMode('register')" style="color: #dc3545; cursor: pointer; text-decoration: underline;">立即註冊</span>
        </p>
    </div>

    <div id="setup-screen" class="panel">
        <div id="menu-toggle-btn" onclick="toggleSidebar(true)">☰</div>

        <h2>🃏 24點 遊戲大廳</h2>
        <p style="text-align: right; color: #64748b; font-weight: bold; font-size: 13px; margin: 0 5px 10px 0;">操作官：<span id="user-display" style="color: #dc3545;"></span></p>
        
        <div class="setup-row">
            <label class="title">👥 選擇對戰人數：</label>
            <div class="game-card-container">
                <div class="game-card active" id="card-play-single" onclick="selectPlayMode('single')">
                    <span class="icon">🧘</span>
                    <span class="text">單人獨享</span>
                </div>
                <div class="game-card" id="card-play-battle" onclick="selectPlayMode('battle')">
                    <span class="icon">⚔️</span>
                    <span class="text">雙人對戰</span>
                </div>
            </div>
        </div>

        <div class="setup-row">
            <label class="title">🎯 選擇勝利判定依據：</label>
            <div class="game-card-container">
                <div class="game-card active" id="card-game-rounds" onclick="selectGameMode('rounds')">
                    <span class="icon">📝</span>
                    <span class="text">指定題數</span>
                </div>
                <div class="game-card" id="card-game-time" onclick="selectGameMode('time')">
                    <span class="icon">⏳</span>
                    <span class="text">指定時間</span>
                </div>
            </div>
        </div>

        <div class="setup-row" id="row-rounds">
            <label class="title">調整總出題數：</label>
            <input type="number" id="sel-rounds" value="10" min="1" max="99">
        </div>

        <div class="setup-row" id="row-time" style="display: none;">
            <label class="title">調整限制時間 (單位：分鐘)：</label>
            <input type="number" id="sel-time" value="3" min="1" max="60">
        </div>

        <button onclick="initGame()" style="width: 100%; padding: 12px; font-size: 18px; margin-top: 5px;">啟動戰局</button>
    </div>

    <div id="sidebar-drawer">
        <div class="sidebar-header">
            <h3>⚙️ 控制面板</h3>
            <span class="sidebar-close" onclick="toggleSidebar(false)">×</span>
        </div>
        <button onclick="fetchPersonalHistory()" class="sidebar-btn">📜 查看歷史出題紀錄</button>
        <button onclick="openPasswordModal()" class="sidebar-btn">🔒 安全修改密碼</button>
        <button onclick="handleLogout()" class="sidebar-btn logout">🚪 離開遊戲 (安全登出)</button>
    </div>

    <div id="game-screen">
        <div id="header-info">
            <span class="timer" id="time-display-container">⏳ 時間: <span id="time-display">無限制</span></span>
            <span id="mode-display-container">📝 題數: <span id="round-display">1</span> / <span id="total-round-display">10</span></span>
        </div>

        <div id="score-board">
            <span class="p1-score" id="p1-title">玩家挑戰分數: <span id="score1">0</span></span>
            <span id="p2-score-divider"> &nbsp; | &nbsp; </span>
            <span class="p2-score" id="p2-title">玩家二 (M鍵): <span id="score2">0</span></span>
        </div>

        <div id="buzzer-status">發牌中...</div>
        <div id="msg-box"></div>

        <div class="workspace" id="workspace">
            <div id="cards-container"></div>
            <div id="operators-container">
                <div class="draggable-item operator" draggable="true" data-type="op" data-val="+">+</div>
                <div class="draggable-item operator" draggable="true" data-type="op" data-val="-">-</div>
                <div class="draggable-item operator" draggable="true" data-type="op" data-val="*">×</div>
                <div class="draggable-item operator" draggable="true" data-type="op" data-val="/">÷</div>
                <div class="draggable-item operator" draggable="true" data-type="op" data-val="(">(</div>
                <div class="draggable-item operator" draggable="true" data-type="op" data-val=")">)</div>
            </div>
            <p style="margin-bottom: 5px; color: #64748b; font-size: 12px; font-weight: bold;">▼ 將卡片與符號拖曳至此 (或直接點擊) / 點擊下方區塊可退回 ▼</p>
            <div id="equation-zone"></div>
        </div>

        <div class="controls">
            <button id="skip-btn" onclick="skipRound()" style="background-color: #475569; box-shadow: none;">⏭️ 放棄本題 (跳過)</button>
            <button class="btn-home" onclick="returnToLobby()">🏠 返回大廳</button>
        </div>
    </div>

    <div id="end-screen" class="panel">
        <h1>🏆 戰局結束</h1>
        <h2 id="final-result"></h2>
        <br>
        <button class="btn-home" onclick="returnToLobby()">🏠 返回大廳</button>
    </div>

    <div id="history-modal">
        <div class="modal-content">
            <h2 style="margin-top:0; color:#1e293b; font-weight:bold;">📜 戰績歷史出題明細</h2>
            
            <div class="history-tabs">
                <div class="tab-btn active" id="tab-single" onclick="switchHistoryTab('single')">🧘 單人紀錄</div>
                <div class="tab-btn" id="tab-battle" onclick="switchHistoryTab('battle')">⚔️ 雙人紀錄</div>
            </div>

            <div id="history-list" style="max-height: 45vh; overflow-y: auto; padding-right:5px;">讀取中...</div>
            <br>
            <button onclick="document.getElementById('history-modal').style.display='none'" class="btn-home" style="width:100%;">關閉視窗</button>
        </div>
    </div>

    <div id="password-modal">
        <div class="modal-content">
            <h2 style="margin-top:0; color:#1e293b;">🔒 修改帳號密碼</h2>
            <div id="pwd-modal-msg" class="error" style="margin-bottom: 10px;"></div>
            <div class="setup-row">
                <label class="title">輸入全新密碼：</label>
                <input type="password" id="new-password" placeholder="請輸入新密碼">
            </div>
            <br>
            <button onclick="submitNewPassword()" style="width: 100%; padding: 12px; background-color: #dc3545; box-shadow: none;">確認重設密碼</button>
            <button onclick="document.getElementById('password-modal').style.display='none'" class="btn-home" style="width:100%; margin-top: 12px;">取消關閉</button>
        </div>
    </div>

    <script>
        const BACKEND_URL = 'https://two4point-lc7l.onrender.com';

        const suits = ['♠', '♥', '♦', '♣'];
        let deck = [];
        let scores = { 1: 0, 2: 0 };
        
        let currentUser = '';
        let authMode = 'login'; 
        let playMode = 'single'; 
        let gameMode = 'rounds'; 
        let totalRounds = 10;
        let currentRound = 1;
        let timeRemaining = 300;
        let timerInterval;
        
        let activePlayer = null; 
        let cardsUsedCount = 0;
        let globalHistoryData = [];

        function toggleSidebar(open) {
            const drawer = document.getElementById('sidebar-drawer');
            if (open) drawer.classList.add('open');
            else drawer.classList.remove('open');
        }

        function selectPlayMode(mode) {
            playMode = mode;
            document.getElementById('card-play-single').classList.remove('active');
            document.getElementById('card-play-battle').classList.remove('active');
            document.getElementById(`card-play-${mode}`).classList.add('active');
        }

        function selectGameMode(mode) {
            gameMode = mode;
            document.getElementById('card-game-rounds').classList.remove('active');
            document.getElementById('card-game-time').classList.remove('active');
            document.getElementById(`card-game-${mode}`).classList.add('active');
            
            document.getElementById('row-rounds').style.display = (mode === 'rounds') ? 'block' : 'none';
            document.getElementById('row-time').style.display = (mode === 'time') ? 'block' : 'none';
        }

        function openPasswordModal() {
            document.getElementById('password-modal').style.display = 'flex';
            document.getElementById('new-password').value = '';
            document.getElementById('pwd-modal-msg').innerText = '';
        }

        async function submitNewPassword() {
            const newPwd = document.getElementById('new-password').value.trim();
            const msgBox = document.getElementById('pwd-modal-msg');
            if (!newPwd) {
                msgBox.innerText = '⚠️ 密碼欄位不能留空！';
                return;
            }
            try {
                const res = await fetch(`${BACKEND_URL}/api/update-password`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username: currentUser, newPassword: newPwd })
                });
                const data = await res.json();
                if (!res.ok) {
                    msgBox.innerText = data.message;
                } else {
                    alert(data.message);
                    document.getElementById('password-modal').style.display = 'none';
                }
            } catch (e) {
                msgBox.innerText = '🔴 雲端伺服器連線中斷，請重試！';
            }
        }

        function switchAuthMode(mode) {
            authMode = mode;
            const title = document.getElementById('auth-title');
            const btn = document.getElementById('auth-submit-btn');
            const toggleText = document.getElementById('auth-toggle-text');
            const msgBox = document.getElementById('auth-msg');
            msgBox.innerText = ''; 
            
            if (mode === 'login') {
                title.innerText = '🔐 24點 會員登入';
                btn.innerText = '立即登入';
                btn.style.backgroundColor = '#dc3545';
                toggleText.innerHTML = `還沒有帳號嗎？ <span onclick="switchAuthMode('register')" style="color: #dc3545; cursor: pointer; text-decoration: underline;">立即註冊</span>`;
            } else {
                title.innerText = '📝 24點 會員註冊';
                btn.innerText = '立即註冊';
                btn.style.backgroundColor = '#e67e22';
                toggleText.innerHTML = `已經有帳號了？ <span onclick="switchAuthMode('login')" style="color: #dc3545; cursor: pointer; text-decoration: underline;">立即登入</span>`;
            }
        }

        function submitAuth() { handleAuth(authMode); }

        async function handleAuth(type) {
            const userInp = document.getElementById('auth-username').value.trim();
            const passInp = document.getElementById('auth-password').value.trim();
            const msgBox = document.getElementById('auth-msg');

            if(!userInp || !passInp) {
                msgBox.innerText = '⚠️ 請完整填寫帳號與密碼！';
                return;
            }

            try {
                const res = await fetch(`${BACKEND_URL}/api/${type}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username: userInp, password: passInp })
                });
                const data = await res.json();

                if(!res.ok) {
                    msgBox.innerText = data.message;
                } else {
                    alert(data.message);
                    if(type === 'login') {
                        currentUser = data.username;
                        document.getElementById('user-display').innerText = currentUser;
                        document.getElementById('auth-screen').style.display = 'none';
                        document.getElementById('setup-screen').style.display = 'block';
                    } else {
                        switchAuthMode('login');
                    }
                }
            } catch (e) {
                msgBox.innerText = '🔴 無法連線至雲端後台伺服器！';
            }
        }

        async function fetchPersonalHistory() {
            toggleSidebar(false); 
            const modal = document.getElementById('history-modal');
            const listContainer = document.getElementById('history-list');
            modal.style.display = 'flex';
            listContainer.innerHTML = '正在從雲端數據庫抽取歷史明細...';

            try {
                const res = await fetch(`${BACKEND_URL}/api/history?username=${encodeURIComponent(currentUser)}`);
                if (!res.ok) {
                    const errData = await res.json().catch(() => ({}));
                    listContainer.innerHTML = `❌ 雲端回應錯誤：${errData.message || '無法取得數據'}`;
                    return;
                }
                globalHistoryData = await res.json();
                switchHistoryTab('single');
            } catch (e) {
                listContainer.innerHTML = `❌ 網路連線錯誤！原因：${e.message}`;
            }
        }

        function switchHistoryTab(mode) {
            document.getElementById('tab-single').classList.add('active');
            document.getElementById('tab-battle').classList.add('active');
            if(mode === 'single') document.getElementById('tab-battle').classList.remove('active');
            else document.getElementById('tab-single').classList.remove('active');

            const listContainer = document.getElementById('history-list');
            const filteredData = globalHistoryData.filter(item => item.gameMode === mode);

            if (filteredData.length === 0) {
                listContainer.innerHTML = `🫙 目前尚無任何${mode === 'single' ? '單人獨享' : '雙人對戰'}的算題明細。`;
                return;
            }

            listContainer.innerHTML = filteredData.map((item, idx) => {
                const cardsDisplay = Array.isArray(item.cards) ? item.cards.join(', ') : '未知';
                const winnerDisplay = item.winner || '平手';
                const equationDisplay = item.equation || '無'; 
                const isFailed = winnerDisplay.includes('失敗') || winnerDisplay.includes('放棄');

                return `
                    <div class="history-item">
                        📅 <strong>日期：</strong>${item.playedAt ? new Date(item.playedAt).toLocaleString() : '未知'}<br>
                        🎴 <strong>數字：</strong>[ ${cardsDisplay} ]<br>
                        🧮 <strong>算法：</strong><span style="font-family: monospace; font-size:15px; font-weight:bold; color:#dc3545;">${equationDisplay}</span><br>
                        🏁 <strong>結果：</strong><span style="color:${isFailed ? '#dc3545' : '#15803d'}; font-weight:bold;">${winnerDisplay}</span>
                    </div>
                `;
            }).join('');
        }

        function hasSolution(nums) {
            if (nums.length === 1) return nums[0] === 24;
            for (let i = 0; i < nums.length; i++) {
                for (let j = 0; j < nums.length; j++) {
                    if (i !== j) {
                        let nextNums = [];
                        for (let k = 0; k < nums.length; k++) if (k !== i && k !== j) nextNums.push(nums[k]);
                        let a = nums[i], b = nums[j];
                        let possibleValues = [a + b, a - b, a * b];
                        if (b !== 0 && a % b === 0) possibleValues.push(a / b);
                        for (let val of possibleValues) {
                            nextNums.push(val);
                            if (hasSolution(nextNums)) return true;
                            nextNums.pop();
                        }
                    }
                }
            }
            return false;
        }

        function initGame() {
            scores = { 1: 0, 2: 0 };
            currentRound = 1;
            document.getElementById('score1').innerText = '0';
            document.getElementById('score2').innerText = '0';

            if (playMode === 'single') {
                document.getElementById('p1-title').innerHTML = `玩家挑戰分數: <span id="score1">0</span>`;
                document.getElementById('p2-score-divider').style.display = 'none';
                document.getElementById('p2-title').style.display = 'none';
                document.getElementById('skip-btn').innerText = '⏭️ 放棄本題 (跳過)';
            } else {
                document.getElementById('p1-title').innerHTML = `玩家一 (Z鍵): <span id="score1">0</span>`;
                document.getElementById('p2-score-divider').style.display = 'inline';
                document.getElementById('p2-title').style.display = 'inline';
                document.getElementById('skip-btn').innerText = '⏭️ 雙方放棄跳過 (平手)';
            }
            
            if (gameMode === 'rounds') {
                totalRounds = parseInt(document.getElementById('sel-rounds').value) || 10;
                if (totalRounds < 1) totalRounds = 1;
                document.getElementById('mode-display-container').innerHTML = `📝 題數: <span id="round-display">1</span> / ${totalRounds}`;
                document.getElementById('time-display-container').innerHTML = `⏳ 時間: 無限制`;
            } else {
                let minutesInput = parseInt(document.getElementById('sel-time').value) || 3;
                if (minutesInput < 1) minutesInput = 1;
                timeRemaining = minutesInput * 60; 
                document.getElementById('mode-display-container').innerHTML = `📝 已答題數: <span id="round-display">1</span>`;
                document.getElementById('time-display-container').innerHTML = `⏳ 剩餘時間: <span id="time-display">00:00</span>`;
                
                updateTimerDisplay();
                timerInterval = setInterval(() => {
                    timeRemaining--;
                    updateTimerDisplay();
                    if (timeRemaining <= 0) endGame("⏰ 時間到！");
                }, 1000);
            }

            document.getElementById('setup-screen').style.display = 'none';
            document.getElementById('game-screen').style.display = 'block';
            drawCards();
            setupDragAndDrop();
        }

        function updateTimerDisplay() {
            if (gameMode === 'time') {
                let m = Math.floor(timeRemaining / 60).toString().padStart(2, '0');
                let s = (timeRemaining % 60).toString().padStart(2, '0');
                document.getElementById('time-display').innerText = `${m}:${s}`;
            }
        }

        function drawCards() {
            document.getElementById('round-display').innerText = currentRound;
            document.getElementById('equation-zone').innerHTML = '';
            cardsUsedCount = 0;
            let isValid = false; let tempCards = []; let drawnObjects = [];

            while (!isValid) {
                deck = [];
                for (let i = 1; i <= 13; i++) for (let suit of suits) deck.push({ value: i, suit: suit });
                tempCards = []; drawnObjects = [];
                for (let i = 0; i < 4; i++) {
                    let card = deck.splice(Math.floor(Math.random() * deck.length), 1)[0];
                    tempCards.push(card.value); drawnObjects.push(card);
                }
                if (hasSolution(tempCards)) isValid = true;
            }
            renderCards(drawnObjects);
            
            if(playMode === 'single') {
                activePlayer = 1; 
                document.getElementById('workspace').classList.add('active');
                document.getElementById('buzzer-status').innerText = "🧩 單人挑戰模式：請排出 24 點後，按【空白鍵】送出驗證！";
                document.getElementById('buzzer-status').className = '';
                document.getElementById('msg-box').innerText = '';
            } else {
                resetBuzzer();
            }
        }

        function renderCards(cards) {
            let container = document.getElementById('cards-container');
            container.innerHTML = '';
            cards.forEach((card, index) => {
                let displayValue = card.value;
                if (displayValue === 1) displayValue = 'A';
                else if (displayValue === 11) displayValue = 'J';
                else if (displayValue === 12) displayValue = 'Q';
                else if (displayValue === 13) displayValue = 'K';

                const isRedSuit = (card.suit === '♥' || card.suit === '♦');
                const suitColor = isRedSuit ? '#dc3545' : '#1e293b';

                let cardDiv = document.createElement('div');
                cardDiv.className = `draggable-item card ${isRedSuit ? 'red' : 'black'}`;
                cardDiv.draggable = true; 
                cardDiv.dataset.type = 'card'; 
                cardDiv.dataset.val = card.value; 
                cardDiv.dataset.display = `${card.suit}${displayValue}`;
                cardDiv.id = `card-${index}`; 
                
                cardDiv.innerHTML = `
                    <div style="font-size: 16px; text-align: left; width: 100%; padding-left: 8px; box-sizing: border-box; font-weight: bold; color: ${suitColor};">${card.suit}</div>
                    <div class="card-val" style="font-size: 32px; font-weight: bold; margin-top: -4px; margin-bottom: -4px; color: ${suitColor};">${displayValue}</div>
                    <div style="font-size: 16px; text-align: right; width: 100%; padding-right: 8px; box-sizing: border-box; transform: rotate(180deg); font-weight: bold; color: ${suitColor};">${card.suit}</div>
                `;
                
                cardDiv.onclick = () => { if(activePlayer !== null) addToEquation(cardDiv); };
                container.appendChild(cardDiv);
            });
        }

        function resetBuzzer() {
            activePlayer = null;
            document.getElementById('workspace').classList.remove('active');
            document.getElementById('buzzer-status').innerText = "⚡ 雙人對戰：請準備搶答！ (玩家一按 Z，玩家二按 M)";
            document.getElementById('buzzer-status').className = '';
            document.getElementById('msg-box').innerText = '';
        }

        document.addEventListener('keydown', (e) => {
            if (document.getElementById('game-screen').style.display !== 'block') return;
            if (playMode === 'battle' && activePlayer === null) {
                if (e.key.toLowerCase() === 'z') { activePlayer = 1; lockBuzzer(1, "🔵 玩家一 (藍方) 搶答中！排列後按【空白鍵】送出"); } 
                else if (e.key.toLowerCase() === 'm') { activePlayer = 2; lockBuzzer(2, "🟣 玩家二 (紫方) 搶答中！排列後按【空白鍵】送出"); }
            } else if (e.code === 'Space') {
                e.preventDefault(); evaluateAnswer();
            }
        });

        function lockBuzzer(player, msg) {
            document.getElementById('workspace').classList.add('active');
            let status = document.getElementById('buzzer-status');
            status.innerText = msg; status.className = player === 1 ? 'buzzed-p1' : 'buzzed-p2';
        }

        function setupDragAndDrop() {
            let eqZone = document.getElementById('equation-zone');
            document.querySelectorAll('.operator').forEach(op => {
                op.onclick = () => { if(activePlayer !== null) addToEquation(op); };
                op.ondragstart = (e) => dragStart(e, op);
            });
            document.addEventListener('dragstart', (e) => { if (e.target.classList.contains('card')) dragStart(e, e.target); });
            eqZone.ondragover = (e) => { e.preventDefault(); };
            eqZone.ondrop = (e) => {
                e.preventDefault(); if (activePlayer === null) return;
                let sourceId = e.dataTransfer.getData("id");
                let isOp = e.dataTransfer.getData("isOp") === "true";
                let el = isOp ? document.querySelector(`.operator[data-val="${sourceId}"]`) : document.getElementById(sourceId);
                if(el) addToEquation(el);
            };
        }

        function dragStart(e, el) {
            if (activePlayer === null) { e.preventDefault(); return; }
            e.dataTransfer.setData("id", el.dataset.type === 'op' ? el.dataset.val : el.id);
            e.dataTransfer.setData("isOp", el.dataset.type === 'op');
        }

        function addToEquation(el) {
            let isCard = el.dataset.type === 'card';
            if (isCard) { el.style.display = 'none'; cardsUsedCount++; }
            let newEqItem = document.createElement('span');
            newEqItem.className = 'eq-item'; newEqItem.innerText = isCard ? el.dataset.display : el.innerText; newEqItem.dataset.val = el.dataset.val;
            if (isCard) newEqItem.dataset.sourceId = el.id;
            newEqItem.onclick = function() {
                if (this.dataset.sourceId) { document.getElementById(this.dataset.sourceId).style.display = 'flex'; cardsUsedCount--; }
                this.remove();
            };
            document.getElementById('equation-zone').appendChild(newEqItem);
        }

        function clearEquationZone() {
            document.getElementById('equation-zone').innerHTML = '';
            document.querySelectorAll('.card').forEach(c => c.style.display = 'flex');
            cardsUsedCount = 0;
        }

        function processNextRound() {
            currentRound++;
            if (gameMode === 'rounds' && currentRound > totalRounds) endGame("🏆 戰役任務全數達成！");
            else drawCards();
        }

        function evaluateAnswer() {
            let msgBox = document.getElementById('msg-box');
            if (cardsUsedCount !== 4) { msgBox.innerHTML = "<span class='error'>❌ 必須部署全部 4 張戰術單卡！</span>"; return; }
            
            let eqItems = Array.from(document.getElementById('equation-zone').children);
            let originalEquationString = eqItems.map(item => item.innerText).join(' ');
            let mathStr = eqItems.map(item => item.dataset.val === '×' ? '*' : (item.dataset.val === '÷' ? '/' : item.dataset.val)).join('');
            try {
                let result = eval(mathStr);
                if (result === 24) {
                    msgBox.innerHTML = "<span class='success'>🎉 解密成功！完美達成 24 點！</span>";
                    scores[activePlayer]++; document.getElementById(`score${activePlayer}`).innerText = scores[activePlayer];
                    let currentCards = Array.from(document.querySelectorAll('.card')).map(c => parseInt(c.dataset.val));
                    saveGameStatsToServer(activePlayer === 1 ? 1 : 0, activePlayer === 2 ? 1 : 0, currentCards, originalEquationString);
                    setTimeout(processNextRound, 1500);
                } else {
                    // 🌟 核心升級：算錯時，單人與雙人模式皆會自動 1.5 秒重置卡牌歸位
                    msgBox.innerHTML = `<span class='error'>❌ 運算結果為 ${result} 部署失敗！卡牌重置中...</span>`;
                    setTimeout(() => { 
                        clearEquationZone(); 
                        if (playMode === 'battle') resetBuzzer(); 
                        else document.getElementById('msg-box').innerHTML = ''; 
                    }, 1500);
                }
            } catch (e) {
                // 🌟 核心升級：結構出錯時，單人與雙人模式皆會自動 1.5 秒重置卡牌歸位
                msgBox.innerHTML = "<span class='error'>❌ 算式結構錯誤，請重新排列！卡牌重置中...</span>";
                setTimeout(() => { 
                    clearEquationZone(); 
                    if (playMode === 'battle') resetBuzzer(); 
                    else document.getElementById('msg-box').innerHTML = ''; 
                }, 1500);
            }
        }

        function skipRound() {
            let currentCards = Array.from(document.querySelectorAll('.card')).map(c => parseInt(c.dataset.val));
            saveGameStatsToServer(0, 0, currentCards, '無'); // 修正之前的打字拼寫
            processNextRound();
        }

        async function saveGameStatsToServer(p1, p2, cards, equation) {
            try {
                await fetch(`${BACKEND_URL}/api/stats`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username: currentUser, gameMode: playMode, p1: p1, p2: p2, cards: cards, equation: equation })
                });
            } catch (error) { console.error(error); }
        }

        function endGame(reason) {
            clearInterval(timerInterval);
            document.getElementById('game-screen').style.display = 'none';
            document.getElementById('end-screen').style.display = 'block';
            let resText = `${reason}<br><br>`;
            if (playMode === 'single') resText += `👤 本局你一共成功通關：${scores[1]} 關！`;
            else {
                resText += `藍方勝局: ${scores[1]} | 紫方勝局: ${scores[2]}<br><br>`;
                resText += scores[1] > scores[2] ? "🏆 藍方部隊 贏得這場戰役！" : (scores[2] > scores[1] ? "🏆 紫方部隊 贏得這場戰役！" : "🤝 旗鼓相當，平手結算！");
            }
            document.getElementById('final-result').innerHTML = resText;
        }

        function returnToLobby() {
            clearInterval(timerInterval); toggleSidebar(false);
            document.getElementById('game-screen').style.display = 'none';
            document.getElementById('end-screen').style.display = 'none';
            document.getElementById('setup-screen').style.display = 'block';
        }

        function handleLogout() {
            currentUser = ''; toggleSidebar(false);
            document.getElementById('auth-username').value = ''; document.getElementById('auth-password').value = '';
            switchAuthMode('login');
            document.getElementById('setup-screen').style.display = 'none';
            document.getElementById('auth-screen').style.display = 'block';
        }
    </script>
</body>
</html>
