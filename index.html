<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>24點 搶答對戰版</title>
    <style>
        body {
            font-family: "Microsoft JhengHei", Arial, sans-serif;
            background-color: #f4f7f6;
            color: #333;
            text-align: center;
            padding: 20px;
            margin: 0;
            user-select: none;
        }
        h1 { color: #2c3e50; margin-bottom: 10px; }
        
        /* 設定大廳 */
        #setup-screen {
            background: #fff;
            max-width: 400px;
            margin: 50px auto;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }
        .setup-row { margin-bottom: 20px; text-align: left; }
        .setup-row label.title { font-weight: bold; display: block; margin-bottom: 8px; }
        .setup-row select { width: 100%; padding: 10px; font-size: 16px; border-radius: 6px; }
        
        /* 模式選擇單選框的樣式 */
        .mode-options { display: flex; gap: 20px; font-size: 18px; padding-bottom: 10px; border-bottom: 2px dashed #eee; margin-bottom: 15px;}
        .mode-options label { cursor: pointer; }

        /* 遊戲主畫面 */
        #game-screen, #end-screen { display: none; }
        
        #header-info {
            display: flex;
            justify-content: space-between;
            max-width: 800px;
            margin: 0 auto 10px;
            font-size: 18px;
            font-weight: bold;
            background: #fff;
            padding: 10px 20px;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        .timer { color: #e74c3c; }
        
        #score-board {
            font-size: 24px;
            font-weight: bold;
            margin: 10px auto 20px;
            padding: 15px;
            background: #fff;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            display: inline-block;
            width: 80%;
            max-width: 600px;
        }
        .p1-score { color: #2980b9; }
        .p2-score { color: #8e44ad; }

        /* 搶答提示區 */
        #buzzer-status {
            font-size: 22px;
            font-weight: bold;
            color: #d35400;
            margin: 10px 0;
            padding: 10px;
            border-radius: 8px;
            background-color: #fdebd0;
            transition: all 0.3s;
        }
        .buzzed-p1 { background-color: #d6eaf8 !important; color: #2980b9 !important; }
        .buzzed-p2 { background-color: #f4ecf8 !important; color: #8e44ad !important; }

        /* 撲克牌與符號區 */
        .workspace {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
            pointer-events: none;
            opacity: 0.5;
            transition: opacity 0.3s;
        }
        .workspace.active { pointer-events: auto; opacity: 1; }

        #cards-container, #operators-container {
            display: flex;
            justify-content: center;
            gap: 15px;
            min-height: 120px;
        }
        #operators-container { min-height: auto; margin-bottom: 10px; }

        .draggable-item {
            background: #fff;
            border: 2px solid #ccc;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 2px 2px 8px rgba(0,0,0,0.1);
            transition: transform 0.1s;
        }
        .draggable-item:hover { transform: scale(1.05); border-color: #3498db; }
        .draggable-item:active { transform: scale(0.95); }

        .card { width: 80px; height: 120px; font-size: 28px; flex-direction: column; }
        .operator { width: 50px; height: 50px; font-size: 24px; border-radius: 50%; color: #34495e; }
        
        .red { color: #e74c3c; }
        .black { color: #2c3e50; }

        /* 算式放置區 */
        #equation-zone {
            width: 80%;
            max-width: 600px;
            min-height: 80px;
            background: #fff;
            border: 3px dashed #bdc3c7;
            border-radius: 12px;
            margin: 20px auto;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-wrap: wrap;
            gap: 10px;
            padding: 15px;
            font-size: 32px;
            font-family: monospace;
        }
        #equation-zone.dragover { background-color: #ecf0f1; border-color: #3498db; }
        
        .eq-item {
            background: #ecf0f1;
            padding: 5px 15px;
            border-radius: 8px;
            cursor: pointer;
            box-shadow: 1px 1px 3px rgba(0,0,0,0.2);
            font-weight: bold;
        }
        .eq-item:hover { background: #e74c3c; color: white; }

        .controls { margin: 20px 0; display: flex; justify-content: center; gap: 15px; }
        button {
            padding: 12px 25px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            border: none;
            border-radius: 8px;
            background-color: #27ae60;
            color: white;
            transition: background 0.3s;
        }
        button:hover { background-color: #2ecc71; }
        
        .btn-home { background-color: #7f8c8d; }
        .btn-home:hover { background-color: #95a5a6; }

        #msg-box { font-size: 18px; font-weight: bold; min-height: 25px; margin: 10px; }
        .success { color: #27ae60; }
        .error { color: #e74c3c; }

    </style>
</head>
<body>

    <div id="setup-screen">
        <h1>🃏 24點 搶答模式</h1>
        
        <div class="setup-row">
            <label class="title">選擇比賽模式：</label>
            <div class="mode-options">
                <label><input type="radio" name="gameMode" value="rounds" checked onchange="toggleMode()"> 指定題數</label>
                <label><input type="radio" name="gameMode" value="time" onchange="toggleMode()"> 指定時間</label>
            </div>
        </div>

        <div class="setup-row" id="row-rounds">
            <label class="title">總題數 (先完成者勝)：</label>
            <select id="sel-rounds">
                <option value="10">10 題</option>
                <option value="20">20 題</option>
                <option value="25">25 題</option>
            </select>
        </div>

        <div class="setup-row" id="row-time" style="display: none;">
            <label class="title">遊戲時間 (時間內高分者勝)：</label>
            <select id="sel-time">
                <option value="180">3 分鐘</option>
                <option value="300">5 分鐘</option>
                <option value="600">10 分鐘</option>
            </select>
        </div>

        <button onclick="initGame()">開始對戰</button>
    </div>

    <div id="game-screen">
        <div id="header-info">
            <span class="timer" id="time-display-container">⏳ 時間: <span id="time-display">無限制</span></span>
            <span id="mode-display-container">📝 題數: <span id="round-display">1</span> / <span id="total-round-display">10</span></span>
        </div>

        <div id="score-board">
            <span class="p1-score">玩家一 (Z鍵): <span id="score1">0</span></span>
            &nbsp; | &nbsp; 
            <span class="p2-score">玩家二 (M鍵): <span id="score2">0</span></span>
        </div>

        <div id="buzzer-status">準備就緒... 發牌中！</div>
        <div id="msg-box"></div>

        <div class="workspace" id="workspace">
            <div id="cards-container"></div>
            
            <div id="operators-container">
                <div class="draggable-item operator" draggable="true" data-type="op" data-val="+">+</div>
                <div class="draggable-item operator" draggable="true" data-type="op" data-val="-">-</div>
                <div class="draggable-item operator" draggable="true" data-type="op" data-val="*">×</div>
                <div class="draggable-item operator" draggable="true" data-type="op" data-val="/">÷</div>
                <div class="draggable-item operator" draggable="true" data-type="op" data-val="(">(</div>
                <div class="draggable-item operator" draggable="true" data-type="op" data-val=")">)</div>
            </div>

            <p style="margin-bottom: 5px; color: #7f8c8d;">▼ 將卡片與符號拖曳至此 (或直接點擊) / 點擊下方區塊可退回 ▼</p>
            <div id="equation-zone"></div>
        </div>

        <div class="controls">
            <button id="skip-btn" onclick="skipRound()" style="display: none;">⏭️ 雙方放棄跳過 (紀錄為平手)</button>
            <button class="btn-home" onclick="location.reload()">🏠 返回主選單</button>
        </div>
    </div>

    <div id="end-screen">
        <h1>🏆 遊戲結束</h1>
        <h2 id="final-result"></h2>
        <br>
        <button class="btn-home" onclick="location.reload()">🏠 返回主選單</button>
    </div>

    <script>
        const suits = ['♠', '♥', '♦', '♣'];
        let deck = [];
        let scores = { 1: 0, 2: 0 };
        
        let gameMode = 'rounds'; 
        let totalRounds = 10;
        let currentRound = 1;
        let timeRemaining = 300;
        let timerInterval;
        
        let activePlayer = null; 
        let cardsUsedCount = 0;

        function toggleMode() {
            gameMode = document.querySelector('input[name="gameMode"]:checked').value;
            if (gameMode === 'rounds') {
                document.getElementById('row-rounds').style.display = 'block';
                document.getElementById('row-time').style.display = 'none';
            } else {
                document.getElementById('row-rounds').style.display = 'none';
                document.getElementById('row-time').style.display = 'block';
            }
        }

        function hasSolution(nums) {
            if (nums.length === 1) return nums[0] === 24;
            for (let i = 0; i < nums.length; i++) {
                for (let j = 0; j < nums.length; j++) {
                    if (i !== j) {
                        let nextNums = [];
                        for (let k = 0; k < nums.length; k++) if (k !== i && k !== j) nextNums.push(nums[k]);
                        let a = nums[i], b = nums[j];
                        let possibleValues = [a + b, a - b, a * b];
                        if (b !== 0 && a % b === 0) possibleValues.push(a / b);
                        for (let val of possibleValues) {
                            nextNums.push(val);
                            if (hasSolution(nextNums)) return true;
                            nextNums.pop();
                        }
                    }
                }
            }
            return false;
        }

        function initGame() {
            gameMode = document.querySelector('input[name="gameMode"]:checked').value;
            
            if (gameMode === 'rounds') {
                totalRounds = parseInt(document.getElementById('sel-rounds').value);
                document.getElementById('mode-display-container').innerHTML = `📝 題數: <span id="round-display">1</span> / ${totalRounds}`;
                document.getElementById('time-display-container').innerHTML = `⏳ 時間: 無限制`;
            } else {
                timeRemaining = parseInt(document.getElementById('sel-time').value);
                document.getElementById('mode-display-container').innerHTML = `📝 已答題數: <span id="round-display">1</span>`;
                document.getElementById('time-display-container').innerHTML = `⏳ 剩餘時間: <span id="time-display">00:00</span>`;
                
                updateTimerDisplay();
                timerInterval = setInterval(() => {
                    timeRemaining--;
                    updateTimerDisplay();
                    if (timeRemaining <= 0) endGame("時間到！");
                }, 1000);
            }

            document.getElementById('setup-screen').style.display = 'none';
            document.getElementById('game-screen').style.display = 'block';

            drawCards();
            setupDragAndDrop();
        }

        function updateTimerDisplay() {
            if (gameMode === 'time') {
                let m = Math.floor(timeRemaining / 60).toString().padStart(2, '0');
                let s = (timeRemaining % 60).toString().padStart(2, '0');
                document.getElementById('time-display').innerText = `${m}:${s}`;
            }
        }

        function drawCards() {
            document.getElementById('round-display').innerText = currentRound;
            document.getElementById('equation-zone').innerHTML = '';
            cardsUsedCount = 0;
            
            let isValid = false;
            let tempCards = [];
            let drawnObjects = [];

            while (!isValid) {
                deck = [];
                for (let i = 1; i <= 13; i++) for (let suit of suits) deck.push({ value: i, suit: suit });
                tempCards = [];
                drawnObjects = [];
                for (let i = 0; i < 4; i++) {
                    let card = deck.splice(Math.floor(Math.random() * deck.length), 1)[0];
                    tempCards.push(card.value);
                    drawnObjects.push(card);
                }
                if (hasSolution(tempCards)) isValid = true;
            }

            renderCards(drawnObjects);
            resetBuzzer();
        }

        function renderCards(cards) {
            let container = document.getElementById('cards-container');
            container.innerHTML = '';
            cards.forEach((card, index) => {
                let displayValue = card.value;
                if (displayValue === 1) displayValue = 'A';
                else if (displayValue === 11) displayValue = 'J';
                else if (displayValue === 12) displayValue = 'Q';
                else if (displayValue === 13) displayValue = 'K';

                let cardDiv = document.createElement('div');
                cardDiv.className = `draggable-item card ${(card.suit === '♥' || card.suit === '♦') ? 'red' : 'black'}`;
                cardDiv.draggable = true;
                cardDiv.dataset.type = 'card';
                cardDiv.dataset.val = card.value; 
                cardDiv.dataset.display = `${card.suit}${displayValue}`;
                cardDiv.id = `card-${index}`;
                cardDiv.innerHTML = `<span>${card.suit}</span><span>${displayValue}</span>`;
                
                cardDiv.onclick = () => { if(activePlayer !== null) addToEquation(cardDiv); };
                container.appendChild(cardDiv);
            });
        }

        function resetBuzzer() {
            activePlayer = null;
            document.getElementById('workspace').classList.remove('active');
            let status = document.getElementById('buzzer-status');
            status.innerText = "⚡ 請準備搶答！ (玩家一按 Z，玩家二按 M)";
            status.className = '';
            document.getElementById('skip-btn').style.display = 'inline-block';
            document.getElementById('msg-box').innerText = '';
        }

        document.addEventListener('keydown', (e) => {
            if (document.getElementById('game-screen').style.display !== 'block') return;

            if (activePlayer === null) {
                if (e.key.toLowerCase() === 'z') {
                    activePlayer = 1;
                    lockBuzzer(1, "玩家一 (藍方) 搶到了！請排列算式並按【空白鍵】送出");
                } else if (e.key.toLowerCase() === 'm') {
                    activePlayer = 2;
                    lockBuzzer(2, "玩家二 (紫方) 搶到了！請排列算式並按【空白鍵】送出");
                }
            } 
            else if (e.code === 'Space') {
                e.preventDefault(); 
                evaluateAnswer();
            }
        });

        function lockBuzzer(player, msg) {
            document.getElementById('workspace').classList.add('active');
            let status = document.getElementById('buzzer-status');
            status.innerText = msg;
            status.className = player === 1 ? 'buzzed-p1' : 'buzzed-p2';
            document.getElementById('skip-btn').style.display = 'none';
        }

        function setupDragAndDrop() {
            let eqZone = document.getElementById('equation-zone');
            
            document.querySelectorAll('.operator').forEach(op => {
                op.onclick = () => { if(activePlayer !== null) addToEquation(op); };
                op.ondragstart = (e) => dragStart(e, op);
            });

            document.addEventListener('dragstart', (e) => {
                if (e.target.classList.contains('card')) dragStart(e, e.target);
            });

            eqZone.ondragover = (e) => { e.preventDefault(); eqZone.classList.add('dragover'); };
            eqZone.ondragleave = () => eqZone.classList.remove('dragover');
            eqZone.ondrop = (e) => {
                e.preventDefault();
                eqZone.classList.remove('dragover');
                if (activePlayer === null) return;
                
                let sourceId = e.dataTransfer.getData("id");
                let isOp = e.dataTransfer.getData("isOp") === "true";
                let el = isOp ? document.querySelector(`.operator[data-val="${sourceId}"]`) : document.getElementById(sourceId);
                if(el) addToEquation(el);
            };
        }

        function dragStart(e, el) {
            if (activePlayer === null) { e.preventDefault(); return; }
            let isOp = el.dataset.type === 'op';
            e.dataTransfer.setData("id", isOp ? el.dataset.val : el.id);
            e.dataTransfer.setData("isOp", isOp);
        }

        function addToEquation(el) {
            let isCard = el.dataset.type === 'card';
            let val = el.dataset.val;
            let display = isCard ? el.dataset.display : el.innerText;

            if (isCard) {
                el.style.display = 'none';
                cardsUsedCount++;
            }

            let newEqItem = document.createElement('span');
            newEqItem.className = 'eq-item';
            newEqItem.innerText = display;
            newEqItem.dataset.val = val; 
            if (isCard) newEqItem.dataset.sourceId = el.id;

            newEqItem.onclick = function() {
                if (this.dataset.sourceId) {
                    document.getElementById(this.dataset.sourceId).style.display = 'flex';
                    cardsUsedCount--;
                }
                this.remove();
            };

            document.getElementById('equation-zone').appendChild(newEqItem);
        }

        function clearEquationZone() {
            document.getElementById('equation-zone').innerHTML = '';
            document.querySelectorAll('.card').forEach(c => c.style.display = 'flex');
            cardsUsedCount = 0;
        }

        function processNextRound() {
            currentRound++;
            if (gameMode === 'rounds' && currentRound > totalRounds) {
                endGame("所有題數已完成！");
            } else {
                drawCards();
            }
        }

        function evaluateAnswer() {
            let msgBox = document.getElementById('msg-box');
            
            if (cardsUsedCount !== 4) {
                msgBox.innerHTML = "<span class='error'>❌ 必須使用全部 4 張牌！請繼續排列。</span>";
                return;
            }

            let eqItems = Array.from(document.getElementById('equation-zone').children);
            let mathStr = eqItems.map(item => {
                let v = item.dataset.val;
                if(v === '×') return '*';
                if(v === '÷') return '/';
                return v;
            }).join('');

            try {
                let result = eval(mathStr);
                if (result === 24) {
                    msgBox.innerHTML = "<span class='success'>🎉 恭喜答對！進入下一題...</span>";
                    scores[activePlayer]++;
                    document.getElementById(`score${activePlayer}`).innerText = scores[activePlayer];
                    
                    let currentCards = Array.from(document.querySelectorAll('.card')).map(c => parseInt(c.dataset.val));
                    let p1RoundWin = (activePlayer === 1) ? 1 : 0;
                    let p2RoundWin = (activePlayer === 2) ? 1 : 0;
                    
                    saveGameStatsToServer(p1RoundWin, p2RoundWin, currentCards);

                    setTimeout(() => {
                        processNextRound(); 
                    }, 1500);

                } else {
                    msgBox.innerHTML = `<span class='error'>❌ 算出來是 ${result}，答錯了！重置並重新開放搶答。</span>`;
                    setTimeout(() => {
                        clearEquationZone();
                        resetBuzzer();
                    }, 2000);
                }
            } catch (e) {
                msgBox.innerHTML = "<span class='error'>❌ 算式格式錯誤 (例如括號不完整)！</span>";
                setTimeout(() => {
                    clearEquationZone();
                    resetBuzzer();
                }, 2000);
            }
        }

        function skipRound() {
            let msgBox = document.getElementById('msg-box');
            msgBox.innerHTML = "<span class='error'>⏭️ 雙方放棄！紀錄為平手，準備進入下一題...</span>";
            
            document.getElementById('skip-btn').style.display = 'none';

            let currentCards = Array.from(document.querySelectorAll('.card')).map(c => parseInt(c.dataset.val));
            saveGameStatsToServer(0, 0, currentCards);

            setTimeout(() => {
                processNextRound(); 
            }, 1500);
        }

        async function saveGameStatsToServer(p1, p2, cards) {
            try {
                // 🌟 關鍵修正：補上後方的 /api/stats 路由門牌
                const response = await fetch('https://two4point-lc7l.onrender.com/api/stats', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ p1: p1, p2: p2, cards: cards }) 
                });

                const result = await response.json();
                console.log("伺服器回應：", result.message);
            } catch (error) {
                console.error("資料上傳失敗：", error);
            }
        }

        function endGame(reason) {
            clearInterval(timerInterval); 
            document.getElementById('game-screen').style.display = 'none';
            document.getElementById('end-screen').style.display = 'block';

            let resText = `${reason}<br><br>玩家一得分: ${scores[1]}<br>玩家二得分: ${scores[2]}<br><br>`;
            if (scores[1] > scores[2]) resText += "🏆 玩家一 獲勝！";
            else if (scores[2] > scores[1]) resText += "🏆 玩家二 獲勝！";
            else resText += "🤝 雙方平手！";

            document.getElementById('final-result').innerHTML = resText;
        }
    </script>
</body>
</html>
